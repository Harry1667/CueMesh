services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cuemesh
      POSTGRES_USER: cuemesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}
    volumes:
      - cuemesh-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuemesh -d cuemesh"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://cuemesh:${POSTGRES_PASSWORD}@db:5432/cuemesh
      WEBSITE_ORIGINS: ${WEBSITE_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  cuemesh-pg:
